name: Copy Pixel Forge Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Copy source repository
        run: |
          rm -rf /tmp/source
          git clone --depth 1 https://github.com/ViperXC132/pixel-forge-client.git /tmp/source
          rm -rf /tmp/source/.git
          cp -a /tmp/source/. .

      - name: Replace target with source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Copy pixel-forge-client source"
          git push --force origin HEAD:main
