name: Fix 1.21.11 API

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/workflows/fix-12111.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch source for 1.21.11
        shell: python
        run: |
          from pathlib import Path
          root = Path('src/main/java')
          for p in root.rglob('*.java'):
              s = p.read_text(encoding='utf-8')
              old = s
              s = s.replace('public boolean mouseClicked(double mouseX, double mouseY, int button) {', 'public boolean mouseClicked(net.minecraft.client.gui.Click click, boolean doubled) {\n        double mouseX = click.x();\n        double mouseY = click.y();\n        int button = click.button();')
              s = s.replace('super.mouseClicked(mouseX, mouseY, button)', 'super.mouseClicked(click, doubled)')
              s = s.replace('.mouseClicked(mouseX, mouseY, button)', '.mouseClicked(click, doubled)')
              s = s.replace('public boolean keyPressed(int keyCode, int scanCode, int modifiers) {', 'public boolean keyPressed(net.minecraft.client.input.KeyInput input) {\n        int keyCode = input.key();\n        int scanCode = input.scancode();\n        int modifiers = input.modifiers();')
              s = s.replace('super.keyPressed(keyCode, scanCode, modifiers)', 'super.keyPressed(input)')
              s = s.replace('.keyPressed(keyCode, scanCode, modifiers)', '.keyPressed(input)')
              s = s.replace('public boolean charTyped(char chr, int modifiers) {', 'public boolean charTyped(net.minecraft.client.input.CharInput input) {\n        char chr = (char) input.codepoint();\n        int modifiers = input.modifiers();')
              s = s.replace('super.charTyped(chr, modifiers)', 'super.charTyped(input)')
              s = s.replace('.charTyped(chr, modifiers)', '.charTyped(input)')
              if s != old:
                  p.write_text(s, encoding='utf-8')

          p = Path('src/main/java/com/pixelforge/module/modules/utility/AutoEatModule.java')
          s = p.read_text(); s = s.replace('getInventory().selectedSlot = i', 'getInventory().setSelectedSlot(i)'); p.write_text(s)
          p = Path('src/main/java/com/pixelforge/module/modules/utility/AutoToolModule.java')
          s = p.read_text(); s = s.replace('getInventory().selectedSlot', 'getInventory().getSelectedSlot()').replace('getInventory().getSelectedSlot() = bestSlot', 'getInventory().setSelectedSlot(bestSlot)'); p.write_text(s)
          p = Path('src/main/java/com/pixelforge/module/modules/system/FovChangerModule.java')
          s = p.read_text().replace('private double customFov = 90.0;', 'private int customFov = 90;').replace('setValue(customFov);', 'setValue(customFov);').replace('public double getCustomFov()', 'public int getCustomFov()').replace('public void setCustomFov(double customFov)', 'public void setCustomFov(int customFov)'); p.write_text(s)
          p = Path('src/main/java/com/pixelforge/module/modules/utility/ZoomModule.java')
          s = p.read_text().replace('private double previousFov = 70.0;', 'private int previousFov = 70;').replace('private final double zoomFov = 20.0;', 'private final int zoomFov = 20;'); p.write_text(s)
          p = Path('src/main/java/com/pixelforge/PixelForgeClient.java')
          s = p.read_text().replace('tickCounter.getTickDelta(false)', 'tickCounter.getTickProgress(false)'); p.write_text(s)

          p = Path('src/main/java/com/pixelforge/account/SkinHelper.java')
          s = p.read_text()
          s = s.replace('DefaultSkinHelper.getSteve().texture()', 'DefaultSkinHelper.getSteve().body().texturePath()')
          s = s.replace('entry.getProfile().getName()', 'entry.getProfile().name()')
          s = s.replace('entry.getSkinTextures().texture()', 'entry.getSkinTextures().body().texturePath()')
          s = s.replace('mc.player.getGameProfile().getName()', 'mc.player.getGameProfile().name()')
          s = s.replace('mc.player.getSkinTextures().texture()', 'DefaultSkinHelper.getSkinTextures(mc.player.getGameProfile()).body().texturePath()')
          s = s.replace('DefaultSkinHelper.getSkinTextures(offlineId).texture()', 'DefaultSkinHelper.getSkinTextures(offlineId).body().texturePath()')
          s = s.replace('context.drawTexture(skin, x, y, size, size, 8.0f, 8.0f, 8, 8, 64, 64)', 'context.drawTexture(net.minecraft.client.gl.RenderPipelines.GUI_TEXTURED, skin, x, y, 8.0f, 8.0f, size, size, 8, 8, 64, 64)')
          s = s.replace('context.drawTexture(skin, x, y, size, size, 40.0f, 8.0f, 8, 8, 64, 64)', 'context.drawTexture(net.minecraft.client.gl.RenderPipelines.GUI_TEXTURED, skin, x, y, 40.0f, 8.0f, size, size, 8, 8, 64, 64)')
          p.write_text(s)

          p = Path('src/main/java/com/pixelforge/account/SessionApplier.java')
          s = p.read_text()
          s = s.replace('Session.AccountType sessionType = (type == AccountManager.AccountType.OFFLINE)\n                    ? Session.AccountType.LEGACY\n                    : Session.AccountType.MSA;', 'String sessionType = type == AccountManager.AccountType.OFFLINE ? "LEGACY" : "MSA";')
          s = s.replace('createSession(username, uuid, accessToken, sessionType)', 'createSession(username, uuid, accessToken, sessionType)')
          s = s.replace('private static Session createSession(String username, UUID uuid, String token, Session.AccountType type)', 'private static Session createSession(String username, UUID uuid, String token, String accountTypeName)')
          s = s.replace('return new Session(username, uuid, token, Optional.empty(), Optional.empty(), type);', 'return null;')
          s = s.replace('args[i] = type;', 'try {\n                            @SuppressWarnings("unchecked") Class<? extends Enum> ec = (Class<? extends Enum>) p[i];\n                            args[i] = Enum.valueOf(ec, accountTypeName);\n                        } catch (Throwable ignored) { args[i] = null; }')
          p.write_text(s)
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Commit fixes
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git diff --cached --quiet || git commit -m 'Fix Minecraft 1.21.11 API compatibility'
          git push
