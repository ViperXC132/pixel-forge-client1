name: Fix 1.21.11 API

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/workflows/fix-12111.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Minecraft 1.21.11 API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.5.1 --distribution-type bin
          chmod +x gradlew

      - name: Build and validate 1.21.11 API
        run: ./gradlew build --stacktrace --warning-mode all

      - name: Verify built mod
        run: |
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh build/libs/*.jar

      - name: Upload validated jar
        uses: actions/upload-artifact@v4
        with:
          name: pixelforge-1.21.11-validated
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
