name: Fix 1.21.11 API

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Minecraft 1.21.11 API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Verify AutoEat is removed
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -i -E 'AutoEatModule|AutoEat|auto[-_ ]?eat' -- ':!.github/'; then
            echo "::error::Stale AutoEat references were found outside .github/."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)AutoEatModule\.java$|(^|/)AutoEat\.java$'; then
            echo "::error::An AutoEat module source file is still tracked."
            exit 1
          fi
          echo "AutoEat module and source references are fully removed."

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.5.1 --distribution-type bin
          chmod +x gradlew

      - name: Build and validate 1.21.11 API
        run: ./gradlew build --stacktrace --warning-mode all

      - name: Verify built mod
        run: |
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh build/libs/*.jar

      - name: Upload validated jar
        uses: actions/upload-artifact@v4
        with:
          name: pixelforge-1.21.11-validated
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
