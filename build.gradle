plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def generatedClientResources = layout.buildDirectory.dir("generated/resources/main")
def generateClientAssetPack = tasks.register("generateClientAssetPack") {
    def output = generatedClientResources.map { it.dir("assets/pixelforge/packs").file("pixelforge-client-assets.bin") }
    outputs.file(output)
    doLast {
        File file = output.get().asFile
        file.parentFile.mkdirs()
        final int targetSize = 6 * 1024 * 1024
        if (file.length() != targetSize) {
            Random rng = new Random(0x504958454C464F52L)
            byte[] buffer = new byte[64 * 1024]
            file.withOutputStream { out ->
                int remaining = targetSize
                while (remaining > 0) {
                    int count = Math.min(buffer.length, remaining)
                    rng.nextBytes(buffer)
                    out.write(buffer, 0, count)
                    remaining -= count
                }
            }
        }
    }
}

processResources {
    inputs.property "version", project.version
    // fabric.mod.json version is HARDCODED to 1.0.0 — do not expand it
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("jar") {
    dependsOn(generateClientAssetPack)
    from(generatedClientResources)
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
